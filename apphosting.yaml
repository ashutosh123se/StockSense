# Firebase App Hosting — Multi-service configuration
# Docs: https://firebase.google.com/docs/app-hosting
#
# Frontend: Vite/React app served at /
# Backend:  FastAPI app proxied at /_/backend

runConfig:
  # Backend runtime settings
  cpu: 1
  memoryMiB: 1024
  concurrency: 10
  minInstances: 0
  maxInstances: 10

env:
  # Tell FastAPI it lives behind the /_/backend proxy prefix
  - variable: ROOT_PATH
    value: "/_/backend"

  # Disable strict DB requirement at startup
  - variable: POSTGRES_SERVER
    value: "127.0.0.1"
  - variable: POSTGRES_PORT
    value: "5432"
  - variable: POSTGRES_USER
    value: "user"
  - variable: POSTGRES_DB
    value: "stocksense"

  # Override these with your real secrets in Firebase Console
  - variable: SECRET_KEY
    secret: STOCKSENSE_SECRET_KEY

  - variable: POSTGRES_PASSWORD
    secret: POSTGRES_PASSWORD
