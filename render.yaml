services:
  - type: web
    name: stocksense-ml-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: >
      pip install --no-cache-dir -r requirements.txt &&
      pip install --no-cache-dir torch==2.1.1+cpu
      --index-url https://download.pytorch.org/whl/cpu
    startCommand: bash start.sh
    envVars:
      - key: PORT
        value: "10000"
      - key: ROOT_PATH
        value: ""
      - key: SECRET_KEY
        generateValue: true
      - key: POSTGRES_SERVER
        fromDatabase:
          name: stocksense-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: stocksense-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: stocksense-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: stocksense-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: stocksense-db
          property: database
      - key: REDIS_HOST
        value: "localhost"
      - key: REDIS_PORT
        value: "6379"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: stocksense-db
    databaseName: stocksense
    user: stocksense_user
    plan: free
